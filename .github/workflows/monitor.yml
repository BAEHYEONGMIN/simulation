name: 화학법령 모니터링
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: 패키지 설치
        working-directory: ./ai_agent
        run: pip install -r requirements.txt
      - name: 모니터링 실행
        working-directory: ./ai_agent
        run: python run_monitoring.py
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}